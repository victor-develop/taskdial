<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>像素动物园 · 111 套预览</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #101216;
    --card: #16191f;
    --line: #262b33;
    --fg: #e8ebef;
    --dim: #8b94a3;
    --accent: #5ad1c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #0d0f13ee;
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; flex: none; }
  header .count { color: var(--dim); font-size: 12px; flex: none; }
  header input[type="search"] {
    background: #1c2129;
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    width: 200px;
  }
  header select {
    background: #1c2129;
    border: 1px solid var(--line);
    color: var(--fg);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
  }
  .theme-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .theme-nav button {
    background: #1c2129;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .theme-nav button:hover { color: var(--fg); border-color: var(--accent); }

  main { padding: 20px; max-width: 1400px; margin: 0 auto; }
  .theme-group { margin-bottom: 32px; }
  .theme-group h2 {
    font-size: 13px;
    color: var(--dim);
    font-weight: 600;
    margin: 0 0 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    scroll-margin-top: 70px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card .names {
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card .names .arrow { color: var(--dim); font-weight: 400; }
  .stage {
    background: #0d0f13;
    border-radius: 8px;
    padding: 6px;
  }
  .stage svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
  .card .loco {
    font-size: 10.5px;
    color: var(--dim);
    line-height: 1.4;
  }
  .card .pairing {
    font-size: 10px;
    color: #5f6773;
    line-height: 1.35;
  }
  .card .slug {
    font-size: 9px;
    color: #4a515c;
    font-family: ui-monospace, monospace;
  }
  .card.flagged { border-color: #a8622e; }
  .card .flag-badge {
    display: none;
    font-size: 9px;
    color: #f0a868;
    background: #a8622e26;
    border-radius: 4px;
    padding: 1px 5px;
    width: fit-content;
  }
  .card.flagged .flag-badge { display: block; }
  .hidden { display: none !important; }
  .empty-msg { color: var(--dim); font-size: 13px; padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🐾 像素动物园</h1>
  <span class="count" id="count"></span>
  <input type="search" id="search" placeholder="搜跑者/目标物/slug…" />
  <select id="locoFilter"><option value="">全部移动方式</option></select>
  <label style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px;flex:none">
    <input type="checkbox" id="flagOnly" /> 只看有疑虑的 (<span id="flagCount">0</span>)
  </label>
  <div class="theme-nav" id="themeNav"></div>
</header>
<main id="main"></main>
<p class="empty-msg hidden" id="emptyMsg">没有匹配的结果</p>

<script>
const RUNNER_W = 16, RUNNER_H = 10, GOAL_N = 11;

// 跟 src/Dial.tsx / src/Runner.tsx 里同一套压缩方式：连续像素段压成一个 path 矩形
function toPath(rows, ch) {
  let d = '';
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      if (row[x] !== ch) { x++; continue; }
      let w = 1;
      while (row[x + w] === ch) w++;
      d += `M${x} ${y}h${w}v1h-${w}z`;
      x += w;
    }
  });
  return d;
}

// 跟 Runner.tsx 里骨头转动同一个手法：顺时针转 90° = 转置
function rot90(rows) {
  const n = rows.length;
  return Array.from({ length: n }, (_, y) =>
    Array.from({ length: n }, (_, x) => rows[n - 1 - x][y]).join('')
  );
}

function svg(inner, w, h, cls) {
  return `<svg viewBox="0 0 ${w} ${h}" class="${cls||''}">${inner}</svg>`;
}

function runnerSvg(sprite, frameIdx, running) {
  const frame = running ? sprite.runnerFrames[frameIdx % 4] : sprite.runnerIdle;
  const body = toPath(frame, '#');
  const eye = toPath(frame, 'o');
  return svg(
    `<path d="${body}" fill="#d8c9a4"/><path d="${eye}" fill="#1a1d22"/>`,
    RUNNER_W, RUNNER_H
  );
}

function goalSvg(sprite, frameIdx) {
  const frames = [sprite.goalFrame0, sprite.goalFrame45, rot90(sprite.goalFrame0), rot90(sprite.goalFrame45)];
  const g = frames[frameIdx % 4];
  return svg(`<path d="${toPath(g, '#')}" fill="#ece5d2"/>`, GOAL_N, GOAL_N);
}

function stageSvg(sprite, tick) {
  const dogW = 46, gap = 4, boneW = 30, trackH = 16;
  const totalW = dogW + gap + boneW;
  const dogFrame = tick % 4;
  const boneFrame = tick % 4;
  const running = true;
  const dogInner = runnerSvg(sprite, dogFrame, running).replace(/<svg[^>]*>|<\/svg>/g, '');
  const boneInner = goalSvg(sprite, boneFrame).replace(/<svg[^>]*>|<\/svg>/g, '');
  return `<svg viewBox="0 0 ${totalW} ${trackH}" style="width:100%;height:auto">
    <g transform="translate(0 ${(trackH - RUNNER_H) / 2}) scale(1)">
      <svg x="0" width="${RUNNER_W}" height="${RUNNER_H}" viewBox="0 0 ${RUNNER_W} ${RUNNER_H}">${dogInner}</svg>
    </g>
    <g transform="translate(${dogW + gap} ${(trackH - GOAL_N) / 2 + 1})">
      <svg width="${GOAL_N}" height="${GOAL_N}" viewBox="0 0 ${GOAL_N} ${GOAL_N}">${boneInner}</svg>
    </g>
  </svg>`;
}

let SPRITES = [];
let FLAGGED = new Set();
let tick = 0;
const cardEls = new Map(); // slug -> {stageEl}

function render(sprites) {
  const byTheme = new Map();
  sprites.forEach(s => {
    if (!byTheme.has(s.themeLabel)) byTheme.set(s.themeLabel, []);
    byTheme.get(s.themeLabel).push(s);
  });

  const main = document.getElementById('main');
  main.innerHTML = '';
  cardEls.clear();

  for (const [label, group] of byTheme) {
    const section = document.createElement('section');
    section.className = 'theme-group';
    section.id = 'theme-' + label.replace(/[^\w]+/g, '');
    section.innerHTML = `<h2>${label} (${group.length})</h2><div class="grid"></div>`;
    const grid = section.querySelector('.grid');
    for (const s of group) {
      const isFlagged = FLAGGED.has(s.slug);
      const card = document.createElement('div');
      card.className = 'card' + (isFlagged ? ' flagged' : '');
      card.dataset.slug = s.slug;
      card.dataset.flagged = isFlagged ? '1' : '0';
      card.innerHTML = `
        <div class="names"><span>${s.runner}</span><span class="arrow">→</span><span>${s.goal}</span></div>
        <div class="stage"></div>
        <div class="flag-badge">⚠ 转起来/剪影可能有问题，代码体检标出的，人工再确认</div>
        <div class="loco">${s.locomotion}</div>
        <div class="pairing">${s.pairing}</div>
        <div class="slug">${s.slug}</div>
      `;
      grid.appendChild(card);
      cardEls.set(s.slug, { sprite: s, stage: card.querySelector('.stage') });
    }
    main.appendChild(section);
  }
}

function tickAll() {
  tick++;
  for (const { sprite, stage } of cardEls.values()) {
    stage.innerHTML = stageSvg(sprite, tick);
  }
}

function buildThemeNav(sprites) {
  const labels = [...new Set(sprites.map(s => s.themeLabel))];
  const nav = document.getElementById('themeNav');
  nav.innerHTML = labels.map(l =>
    `<button data-jump="${l}">${l}</button>`
  ).join('');
  nav.addEventListener('click', e => {
    const l = e.target.dataset.jump;
    if (!l) return;
    document.getElementById('theme-' + l.replace(/[^\w]+/g, ''))?.scrollIntoView({ behavior: 'smooth' });
  });
}

function buildLocoFilter(sprites) {
  const sel = document.getElementById('locoFilter');
  const kinds = ['跑', '飞', '游', '爬', '跳', '滚', '蠕动', '滑', '弹跳'];
  kinds.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k; opt.textContent = k;
    sel.appendChild(opt);
  });
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const loco = document.getElementById('locoFilter').value;
  const flagOnly = document.getElementById('flagOnly').checked;
  let visible = 0;
  for (const [slug, { sprite }] of cardEls) {
    const card = document.querySelector(`.card[data-slug="${CSS.escape(slug)}"]`);
    const hitText = !q || [sprite.runner, sprite.goal, sprite.slug, sprite.pairing]
      .join(' ').toLowerCase().includes(q);
    const hitLoco = !loco || sprite.locomotion.includes(loco);
    const hitFlag = !flagOnly || card.dataset.flagged === '1';
    const show = hitText && hitLoco && hitFlag;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  }
  document.querySelectorAll('.theme-group').forEach(group => {
    const anyVisible = [...group.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
    group.classList.toggle('hidden', !anyVisible);
  });
  document.getElementById('emptyMsg').classList.toggle('hidden', visible > 0);
  document.getElementById('count').textContent = `${visible}/${SPRITES.length}`;
}

Promise.all([
  fetch('sprites.json').then(r => r.json()),
  fetch('flagged_slugs.json').then(r => r.json()).catch(() => []),
])
  .then(([sprites, flagged]) => {
    SPRITES = sprites;
    FLAGGED = new Set(flagged);
    document.getElementById('count').textContent = `${sprites.length}/${sprites.length}`;
    document.getElementById('flagCount').textContent = FLAGGED.size;
    buildThemeNav(sprites);
    buildLocoFilter(sprites);
    render(sprites);
    setInterval(tickAll, 260);
    document.getElementById('search').addEventListener('input', applyFilter);
    document.getElementById('locoFilter').addEventListener('change', applyFilter);
    document.getElementById('flagOnly').addEventListener('change', applyFilter);
  })
  .catch(err => {
    document.getElementById('main').innerHTML =
      `<p class="empty-msg">加载 sprites.json 失败：${err.message}</p>`;
  });
</script>
</body>
</html>
