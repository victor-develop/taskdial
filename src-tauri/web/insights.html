<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>暂停报告 · taskdial</title>
<style>
  /* 跟 app（src/index.css）同一套变量，看起来是一家的 */
  :root {
    --bg: #101216;
    --card: #16191f;
    --line: #262b33;
    --fg: #e8ebef;
    --dim: #8b94a3;
    --accent: #5ad1c0;
    color-scheme: dark;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 24px; }
  .sub a { color: var(--accent); text-decoration: none; }
  .big { font-size: 40px; font-weight: 700; margin: 0; letter-spacing: -1px; }
  .big small { font-size: 16px; font-weight: 500; color: var(--dim); margin-left: 6px; }
  .stats { color: var(--dim); font-size: 13px; margin: 4px 0 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
    margin-top: 16px;
  }
  .block-title {
    display: block;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .hours { display: flex; align-items: flex-end; gap: 4px; height: 72px; }
  .hours i {
    flex: 1;
    background: #3a4150;
    border-radius: 3px 3px 0 0;
    min-height: 2px;
  }
  .hours i.peak { background: var(--accent); }
  .hour-axis {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-size: 11px;
    margin-top: 6px;
  }
  .reasons { display: flex; flex-wrap: wrap; gap: 8px; }
  .reason-chip {
    background: #1e232b;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
  }
  .reason-chip b { color: var(--accent); margin-left: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child td { border-top: none; }
  td.when { color: var(--dim); white-space: nowrap; width: 130px; }
  td.len { white-space: nowrap; width: 70px; font-variant-numeric: tabular-nums; }
  td.why { color: var(--fg); }
  td.why .slice { color: var(--dim); }
  .empty { color: var(--dim); font-size: 14px; }
  .err { color: #e08787; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>暂停报告</h1>
  <p class="sub">近 7 天的暂停记录 · <a href="/">taskdial</a> · <a href="/insights?format=md">markdown 版</a> · <a href="/skills?format=md">API 清单</a></p>
  <div id="out"><p class="empty">加载中…</p></div>
</main>
<script>
  // 聚合全在服务端（src-tauri/src/insights.rs）算好，这里只负责画。
  // 以前这段自己算一遍，跟 ?format=md 那份会漂 —— 同一个报告不该有两套算法。
  const el = (tag, cls, text) => {
    const n = document.createElement(tag)
    if (cls) n.className = cls
    if (text !== undefined) n.textContent = text
    return n
  }

  function render(r) {
    const out = document.getElementById('out')
    out.textContent = ''

    if (r.count === 0) {
      out.append(el('p', 'empty', `近 ${r.windowDays} 天没有暂停过。`))
      return
    }

    const head = el('div')
    const big = el('p', 'big', String(r.count))
    big.append(el('small', '', '次'))
    head.append(big)
    head.append(
      el('p', 'stats', `近 ${r.windowDays} 天 · 共 ${r.total} · 今天 ${r.todayCount} 次`),
    )
    out.append(head)

    const peak = Math.max(1, ...r.hours.map((h) => h.count))
    const hoursCard = el('div', 'card')
    hoursCard.append(el('span', 'block-title', '什么时候暂停'))
    const bars = el('div', 'hours')
    r.hours.forEach((h) => {
      const bar = el('i', h.count === peak && h.count > 0 ? 'peak' : '')
      bar.style.height = Math.max(2, (h.count / peak) * 64) + 'px'
      bar.title = `${h.hour}:00–${h.hour + 1}:00 · ${h.count} 次`
      bars.append(bar)
    })
    hoursCard.append(bars)
    const axis = el('div', 'hour-axis')
    ;['0', '6', '12', '18', '24'].forEach((t) => axis.append(el('span', '', t)))
    hoursCard.append(axis)
    out.append(hoursCard)

    if (r.reasons.length > 0) {
      const card = el('div', 'card')
      card.append(el('span', 'block-title', '最常见'))
      const chips = el('div', 'reasons')
      r.reasons.forEach(([reason, n]) => {
        const chip = el('span', 'reason-chip', reason + ' ')
        chip.append(el('b', '', String(n)))
        chips.append(chip)
      })
      card.append(chips)
      out.append(card)
    }

    const card = el('div', 'card')
    card.append(el('span', 'block-title', '最近'))
    const table = el('table')
    r.recent.forEach((p) => {
      const tr = el('tr')
      tr.append(el('td', 'when', `${p.day} ${p.clock}`))
      tr.append(el('td', 'len', p.duration + (p.open ? ' ⏸' : '')))
      const why = el('td', 'why')
      if (p.reason) {
        why.append(document.createTextNode(p.reason + ' '))
        if (p.sliceName) why.append(el('span', 'slice', '· ' + p.sliceName))
      } else {
        why.append(el('span', 'slice', p.sliceName || ''))
      }
      tr.append(why)
      table.append(tr)
    })
    card.append(table)
    out.append(card)
  }

  fetch('/insights?format=json')
    .then(async (r) => {
      if (!r.ok) throw new Error('读报告失败（HTTP ' + r.status + '）')
      return r.json()
    })
    .then(render)
    .catch((e) => {
      const out = document.getElementById('out')
      out.textContent = ''
      out.append(el('p', 'err', e.message))
    })
</script>
</body>
</html>
